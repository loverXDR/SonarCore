services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sonarcore_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:

      - ./Api:/app/Api
      - ./Core:/app/Core
      - ./Agent_workflow:/app/Agent_workflow
      - ./Cli:/app/Cli


      - ./.env:/app/.env


      - hf_cache:/root/.cache/huggingface

      - whisper_cache:/root/.cache/whisper

    environment:

      - QDRANT_URL=http://qdrant:6333
    env_file:
      - .env

    depends_on:
      - qdrant

    command: [ "uvicorn", "Api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sonarcore_qdrant
    restart: unless-stopped
    ports:
      - "6337:6333"
      - "6338:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    container_name: sonarcore_postgres
    restart: always
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar_pass
      - POSTGRES_DB=sonarcore
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarcore"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: sonarcore_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://sonar:sonar_pass@postgres:5432/sonarcore?schema=public
      - NEXTAUTH_SECRET=sonarcore_secret_key_change_me
      - NEXTAUTH_URL=http://localhost:3000
      - AUTH_TRUST_HOST=true
      - SONARCORE_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  hf_cache:
    name: sonarcore_hf_cache
  whisper_cache:
    name: sonarcore_whisper_cache
  qdrant_data:
    name: sonarcore_qdrant_data
  postgres_data:
    name: sonarcore_postgres_data
